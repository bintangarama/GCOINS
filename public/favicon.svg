<svg viewBox="0 0 512 512" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gcoinsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="45%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="goldCoin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="45%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="sheenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
  </defs>
  
  <!-- Base Squircle -->
  <rect width="512" height="512" rx="124" fill="url(#gcoinsBg)"/>
  <rect x="8" y="8" width="496" height="496" rx="118" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="12"/>
  
  <!-- Subtle Top Sheen Highlight -->
  <path d="M 12 140 C 12 80 60 20 140 12 L 372 12 C 452 20 500 80 500 140 L 500 200 C 350 170 170 200 12 250 Z" fill="url(#sheenGrad)"/>

  <!-- G Letter (Pure White) -->
  <path d="M 214 195 
           A 86 86 0 1 0 214 317 
           L 214 256 
           L 148 256" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="54" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#iconShadow)"/>
        
  <!-- C Letter (Pure White) -->
  <path d="M 442 195 
           A 86 86 0 1 0 442 317" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="54" 
        stroke-linecap="round" 
        filter="url(#iconShadow)"/>
        
  <!-- Gold Coin Center in C Counter -->
  <circle cx="366" cy="256" r="30" fill="url(#goldCoin)" filter="url(#iconShadow)"/>
  <circle cx="366" cy="256" r="23" fill="none" stroke="#FEF08A" stroke-width="3" opacity="0.9"/>
  <circle cx="366" cy="256" r="8" fill="#FDE047" opacity="0.95"/>
</svg>