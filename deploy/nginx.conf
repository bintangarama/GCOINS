# G-COINS (Gramedia Cash Opname Internal System) - Production Nginx Configuration
# Target: Ubuntu 22.04 / 24.04 LTS (1 vCPU, 2GB RAM)
# File location: /etc/nginx/sites-available/gcoins.conf
# Symlink: ln -s /etc/nginx/sites-available/gcoins.conf /etc/nginx/sites-enabled/

# HTTP - Redirect all traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name gcoins.gramedia.com; # Ganti dengan domain / subdomain Anda

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS - Main Production Virtual Host
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gcoins.gramedia.com; # Ganti dengan domain / subdomain Anda

    root /var/www/gcoins/public;
    index index.php index.html;

    # SSL Certificates (Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/gcoins.gramedia.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gcoins.gramedia.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/gcoins.gramedia.com/chain.pem;

    # SSL Security Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Maximum Upload Size (Struk/Bukti Foto WebP & Excel Import)
    client_max_body_size 10M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Logging
    access_log /var/log/nginx/gcoins-access.log;
    error_log /var/log/nginx/gcoins-error.log error;

    # Main Route Handling for Laravel & Inertia.js SPA
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Static Assets Caching (Vite Output)
    location ~* \.(?:css|js|woff2?|eot|ttf|otf|ico|png|jpg|jpeg|webp|svg|gif)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # PHP-FPM Processing
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 120s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Security: Deny Access to Sensitive Files and Hidden Folders
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny direct access to SQLite database files and logs
    location ~* \.(?:sqlite|sqlite-wal|sqlite-shm|log|env)$ {
        deny all;
        return 404;
    }
}
