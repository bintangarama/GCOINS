# G-COINS Supervisor Worker Configuration
# Target: Ubuntu 22.04 / 24.04 LTS
# File location: /etc/supervisor/conf.d/gcoins.conf
# Commands:
#   supervisorctl reread
#   supervisorctl update
#   supervisorctl start gcoins-worker:*

[program:gcoins-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/gcoins/artisan queue:work database --sleep=3 --tries=3 --max-time=3600 --timeout=120
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/supervisor/gcoins-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=3600
