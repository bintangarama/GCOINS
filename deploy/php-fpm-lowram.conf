; ==============================================================================
; G-COINS PHP 8.4-FPM Pool Configuration (Low-RAM / Budget VPS Mode)
; Target: Ubuntu 22.04 / 24.04 (1 vCPU, 1GB RAM VPS with Telegram Bot)
; File location on server: /etc/php/8.4/fpm/pool.d/gcoins.conf
; ==============================================================================

[gcoins]
user = www-data
group = www-data

; Unix socket communication with Nginx
listen = /run/php/php8.4-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Process Manager Settings:
; 'ondemand' mode spawns worker processes only when incoming web requests arrive
; and kills idle processes after 10s to free physical RAM for the Telegram bot.
pm = ondemand
pm.max_children = 3
pm.process_idle_timeout = 10s
pm.max_requests = 200

; Process execution limits
request_terminate_timeout = 60s
request_slowlog_timeout = 5s
slowlog = /var/log/php8.4-fpm-gcoins-slow.log

; PHP Environment & Limits (Restricted to 128MB to protect system from OOM)
php_admin_value[memory_limit] = 128M
php_admin_value[upload_max_filesize] = 10M
php_admin_value[post_max_size] = 12M
php_admin_value[max_execution_time] = 60
php_admin_value[error_log] = /var/log/php8.4-fpm-gcoins-error.log
php_admin_flag[log_errors] = on
