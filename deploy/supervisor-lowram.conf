# ==============================================================================
# G-COINS Supervisor Worker Configuration (Low-RAM VPS Mode)
# Target: Ubuntu 22.04 / 24.04 LTS (1 vCPU, 1GB RAM)
# File location on server: /etc/supervisor/conf.d/gcoins.conf
# ==============================================================================

[program:gcoins-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/gcoins/artisan queue:work database --sleep=3 --tries=3 --max-jobs=50 --memory=64 --timeout=60
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/gcoins-worker.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
stopwaitsecs=60
