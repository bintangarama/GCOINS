; G-COINS PHP 8.4-FPM Pool Configuration
; Target: Ubuntu 22.04 / 24.04 (1 vCPU, 2GB RAM VPS)
; File location: /etc/php/8.4/fpm/pool.d/gcoins.conf

[gcoins]
user = www-data
group = www-data

; Unix socket communication with Nginx
listen = /run/php/php8.4-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Process Manager Settings
; Tuned specifically for 1 vCPU / 2GB RAM to avoid OOM while supporting 10-15 concurrent users
pm = dynamic
pm.max_children = 10
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 4
pm.max_requests = 1000

; Process execution limits
request_terminate_timeout = 120s
request_slowlog_timeout = 5s
slowlog = /var/log/php8.4-fpm-gcoins-slow.log

; PHP Environment & Settings
php_admin_value[memory_limit] = 256M
php_admin_value[upload_max_filesize] = 10M
php_admin_value[post_max_size] = 12M
php_admin_value[max_execution_time] = 120
php_admin_value[error_log] = /var/log/php8.4-fpm-gcoins-error.log
php_admin_flag[log_errors] = on

; OPcache Settings (can be verified in /etc/php/8.4/mods-available/opcache.ini)
; opcache.enable=1
; opcache.memory_consumption=128
; opcache.interned_strings_buffer=16
; opcache.max_accelerated_files=10000
; opcache.revalidate_freq=0
; opcache.validate_timestamps=0 (in production, reset on deploy)
; opcache.save_comments=1
